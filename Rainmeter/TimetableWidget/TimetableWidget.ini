[Rainmeter]
Update=20000
AccurateText=1
AlwaysOnTop=-2
Draggable=1
KeepOnScreen=1
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=Set Week A
ContextAction=[!CommandMeasure MeasureList "SetWeek('A')"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
ContextTitle2=Set Week B
ContextAction2=[!CommandMeasure MeasureList "SetWeek('B')"][!UpdateMeasure *][!UpdateMeter *][!Redraw]
ContextTitle3=Refresh now
ContextAction3=[!UpdateMeasure *][!UpdateMeter *][!Redraw]

[Metadata]
Name=Timetable Widget
Author=Ibrahim Rahman
Description=Shows the current/next 12RD lesson, sitting directly on the desktop.
Version=2.0

[Variables]
PanelW=308
PanelH=270
TextColor=230,232,240,255
MutedColor=140,145,165,255
AccentColor=125,165,255,255
StatusColor=145,215,180,255

; ---------- background panel ----------
[BackgroundPanel]
Meter=Shape
Shape=Rectangle 0,0,#PanelW#,#PanelH#,14 | Fill Color 18,19,32,225 | StrokeWidth 1 | Stroke Color 90,105,150,90

; ---------- header row: date (left) + week badge (right) ----------
[MeasureHeader]
Measure=Script
ScriptFile=#@#schedule.lua
Mode=Header

[MeterDate]
Meter=String
MeasureName=MeasureHeader
Text=%1
X=20
Y=16
FontFace=Segoe UI Semibold
FontSize=13
FontColor=#TextColor#
StringAlign=Left
AntiAlias=1

[MeasureWeek]
Measure=Script
ScriptFile=#@#schedule.lua
Mode=Week

[WeekBadge]
Meter=Shape
X=(#PanelW# - 92)
Y=14
Shape=Rectangle 0,0,72,24,12 | Fill Color 40,60,110,220 | StrokeWidth 1 | Stroke Color #AccentColor#

[MeterWeek]
Meter=String
MeasureName=MeasureWeek
Text=%1
X=(#PanelW# - 92)
Y=20
W=72
H=24
FontFace=Segoe UI Semibold
FontSize=9
FontColor=#AccentColor#
StringAlign=Center
AntiAlias=1

; ---------- thin divider ----------
[Divider]
Meter=Shape
X=20
Y=50
; width is PanelW(308) - 40 margin, hardcoded since Shape's compound value
; doesn't reliably support inline variable arithmetic like a plain X=/W= option does
Shape=Rectangle 0,0,268,1 | Fill Color 90,105,150,110

; ---------- status line ----------
[MeasureStatus]
Measure=Script
ScriptFile=#@#schedule.lua
Mode=Status

[MeterStatus]
Meter=String
MeasureName=MeasureStatus
Text=%1
X=20
Y=62
W=(#PanelW# - 40)
FontFace=Segoe UI
FontSize=10
FontColor=#StatusColor#
StringAlign=Left
ClipString=1
AntiAlias=1

; ---------- period list ----------
[MeasureList]
Measure=Script
ScriptFile=#@#schedule.lua
Mode=List

[MeterList]
Meter=String
MeasureName=MeasureList
Text=%1
X=20
Y=90
W=(#PanelW# - 40)
FontFace=Consolas
FontSize=10
FontColor=#TextColor#
StringAlign=Left
AntiAlias=1
