[Rainmeter]
Update=20000
AccurateText=1
DynamicWindowSize=1
AlwaysOnTop=-2
Draggable=1
KeepOnScreen=1
BackgroundMode=2
SolidColor=20,20,35,190
RightMouseUpAction=[!SkinCustomMenu]
ContextTitle=Set Week A
ContextAction=[!CommandMeasure MeasureSchedule "SetWeek('A')"][!UpdateMeasure MeasureSchedule][!UpdateMeter *][!Redraw]
ContextTitle2=Set Week B
ContextAction2=[!CommandMeasure MeasureSchedule "SetWeek('B')"][!UpdateMeasure MeasureSchedule][!UpdateMeter *][!Redraw]
ContextTitle3=Refresh now
ContextAction3=[!UpdateMeasure MeasureSchedule][!UpdateMeter *][!Redraw]

[Metadata]
Name=Timetable Widget
Author=Ibrahim Rahman
Description=Shows the current/next 12RD lesson, sitting directly on the desktop.
Version=1.0

[MeasureSchedule]
Measure=Script
ScriptFile=#@#schedule.lua

[MeterDisplay]
Meter=String
MeasureName=MeasureSchedule
Text=%1
X=14
Y=10
FontFace=Segoe UI
FontSize=10
FontColor=235,235,245,255
StringAlign=Left
StringStyle=Normal
ClipString=0
AntiAlias=1
